<div class="tarjeta tarjeta--angosta">
  <h2>Iniciar sesión</h2>

  <!-- [formGroup]: conecta el <form> con el FormGroup del componente -->
  <!-- (ngSubmit): se dispara al enviar el formulario (botón submit o Enter) -->
  <form [formGroup]="formulario" (ngSubmit)="enviar()">
    <div class="campo">
      <label for="correo">Correo</label>
      <input id="correo" type="email" formControlName="correo" />
      <!-- Mostramos el error solo si el campo fue tocado y es inválido -->
      <small class="error" *ngIf="correo.invalid && correo.touched">
        Ingresa un correo válido
      </small>
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" />
      <small class="error" *ngIf="password.invalid && password.touched">
        La contraseña es obligatoria
      </small>
    </div>

    <small class="error" *ngIf="errorMensaje">{{ errorMensaje }}</small>

    <button type="submit" [disabled]="cargando">
      {{ cargando ? "Ingresando..." : "Ingresar" }}
    </button>
  </form>

  <p class="ayuda">
    Usuario de prueba: <b>admin&#64;kinal.edu.gt</b> — contraseña definida en el .env del backend.
  </p>
</div>
